name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Commit APK to repo
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PaymentHelper.apk
          git config user.name "builder-bot"
          git config user.email "bot@users.noreply.github.com"
          git add PaymentHelper.apk
          git commit -m "Built APK from sources [skip ci]" || echo "no changes"
          git push
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaymentHelper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
